<!doctype html>
<!-- Boot-time class is stamped from the persisted design system, surface
     style, and theme (localStorage 'memlore-ui') so matching tokens resolve
     immediately. Leftover designSystem 'lumen' is Signature + surface-lumen. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Boot-time background shim — paints the matching --color-app colour
         (Clean light #ffffff, Clean dark #252525, Signature light #f4f3f1,
         Signature dark #0d0d0d, Signature Lumen surface dark #05070d =
         oklch(13% 0.014 265), Clay light #ebe3d6, Clay dark
         #171513) before the JS-injected CSS loads, so there is
         no flash on cold start. Lumen is a Signature-only dark surface.
         Keep in lockstep with the repo-root index.html. -->
    <script>
      ;(function () {
        var ds = 'signature',
          theme = 'dark',
          surface = 'deep',
          radius = 'low'
        try {
          var p = JSON.parse(localStorage.getItem('memlore-ui') || '{}').state || {}
          if (p.designSystem === 'clean') ds = 'clean'
          if (p.designSystem === 'clay') ds = 'clay'
          if (p.surfaceStyle === 'lumen' || p.surfaceStyle === 'soft' || p.surfaceStyle === 'deep')
            surface = p.surfaceStyle
          if (p.designSystem === 'lumen') surface = 'lumen'
          if (p.theme === 'light' || p.theme === 'dark') theme = p.theme
          if (p.cornerRadius === 'medium' || p.cornerRadius === 'high' || p.cornerRadius === 'low')
            radius = p.cornerRadius
        } catch (e) {}
        var light = theme === 'light'
        if (ds === 'signature' && surface === 'lumen') light = false
        var cls = 'ds-' + ds + (light ? '' : ' dark')
        if (!light && ds === 'signature') {
          if (surface === 'lumen') cls += ' surface-lumen'
          else if (surface === 'soft') cls += ' surface-soft'
        }
        if (radius === 'medium') cls += ' rad-medium'
        else if (radius === 'high') cls += ' rad-high'
        var r = document.documentElement
        r.className = cls
        r.style.backgroundColor = light
          ? ds === 'clean'
            ? '#ffffff'
            : ds === 'clay'
              ? '#ebe3d6'
              : '#f4f3f1'
          : ds === 'signature' && surface === 'lumen'
            ? '#05070d'
            : ds === 'clean'
              ? '#252525'
              : ds === 'clay'
                ? '#171513'
                : '#0d0d0d'
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-with-container/logo-iOS-Default-128x128@2x.png" />
    <title>Memlore — Web Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
