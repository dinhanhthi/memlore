<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      p.p1 {
        margin: 0px 0px 0px 0px;
        font: 18px '.AppleSystemUIFont';
        color: #000000;
      }
      div.pageHeader {
        font-weight: bold;
      }
      div.title {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <p class="p1">
      <span class="s1">
        <div>
          <div class="pageHeader">Tuesday, March 9, 2024</div>
          <div class="title">Inline mixed</div>
          <div class="bodyText">
            <p>before photo</p>
            <img class="asset_image" src="../Resources/shared-photo.jpg" />
            <p>after photo</p>
            <video class="asset_video">
              <source src="../Resources/clip.mov" type="video/mp4" />
            </video>
            <p>after video</p>
            <audio src="../Resources/memo.m4a"></audio>
            <p class="transcript">synthetic transcript line</p>
            <p>after audio</p>
            <div class="gridItem assetType_map">
              <img class="asset_image" src="../Resources/map-snap.jpg" />
            </div>
            <p>after map</p>
            <div class="gridItem assetType_drawing">
              <img class="asset_image" src="../Resources/drawing.png" />
            </div>
            <p>after drawing</p>
            <div class="gridItem assetType_reflection">
              <span>unknown card caption</span
              ><img class="asset_image" src="../Resources/card-extra.jpg" />
            </div>
            <p>after unknown</p>
          </div>
        </div>
      </span>
    </p>
  </body>
</html>
